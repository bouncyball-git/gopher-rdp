<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>gopher-rdp</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #1a1a2e; overflow: auto; }
  canvas { cursor: default; display: block; }
  #overlay { position: fixed; inset: 0; background: #000; color: #cc7000; font: bold 48px sans-serif; z-index: 20; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  #mic-indicator { position: fixed; top: 8px; right: 8px; width: 12px; height: 12px; border-radius: 50%; background: #e00; z-index: 30; display: none; box-shadow: 0 0 6px #e00; }
  #overlay.hidden { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { width: 48px; height: 48px; border: 4px solid #331c00; border-top-color: #cc7000; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 24px; }
</style>
</head>
<body>
<div id="overlay"><div class="spinner" id="spinner"></div><span id="overlay-text">Connecting...</span></div>
<div id="mic-indicator"></div>
<canvas id="screen"></canvas>
<script>
(function() {
  var params = new URLSearchParams(location.search);
  // Scale by devicePixelRatio so the canvas matches physical pixels.
  // Firefox and Chrome report fractional DPR correctly. The canvas pixel
  // buffer is at physical resolution; CSS display size stays at logical.
  // WebGL GL_NEAREST/GL_LINEAR handles the downscale to CSS size.
  // With -no-dpr (?nodpr=1), skip DPR — canvas = logical, compositor upscales.
  //
  // dpr is re-read on every window.resize tick so that dragging the browser
  // window between monitors with different DPRs picks up the new value and
  // re-sizes the RDP session accordingly. Real browsers report
  // devicePixelRatio honestly (including fractional scales) and fire a
  // resize event on cross-monitor moves, so no matchMedia listener is
  // required the way WebKitGTK needs in web2.
  var noDPR = params.get("nodpr") === "1";
  var dpr = noDPR ? 1 : (window.devicePixelRatio || 1);
  var W = parseInt(params.get("w")) || Math.round(window.innerWidth * dpr);
  var H = parseInt(params.get("h")) || Math.round(window.innerHeight * dpr);

  var canvas = document.getElementById("screen");
  var overlay = document.getElementById("overlay");
  var overlayText = document.getElementById("overlay-text");
  var spinner = document.getElementById("spinner");
  canvas.width = W;
  canvas.height = H;
  canvas.style.width = (W / dpr) + "px";
  canvas.style.height = (H / dpr) + "px";

  // WebGL rendering — GPU texture + fullscreen quad for hardware-quality filtering.
  // Falls back to Canvas 2D if WebGL is unavailable.
  var gl = null, glTex = null, ctx = null, glNeedsRedraw = false, glFilter = 0;
  // Offscreen 2D canvas for H.264 VideoFrame → pixel extraction
  var h264Canvas = null, h264Ctx = null;

  (function initRenderer() {
    gl = canvas.getContext("webgl2", {antialias: false, alpha: false});
    if (!gl) gl = canvas.getContext("webgl", {antialias: false, alpha: false});
    if (!gl) {
      ctx = canvas.getContext("2d");
      if (params.get("nearest") === "1") canvas.style.imageRendering = "pixelated";
      console.log("canvas: using Canvas 2D fallback");
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, W, H);
      return;
    }
    console.log("canvas: using WebGL (" + gl.getParameter(gl.VERSION) + ")");
    var vs = gl.createShader(gl.VERTEX_SHADER);
    gl.shaderSource(vs,
      "attribute vec2 a_pos;" +
      "varying vec2 v_uv;" +
      "void main(){v_uv=a_pos*0.5+0.5;v_uv.y=1.0-v_uv.y;gl_Position=vec4(a_pos,0.0,1.0);}");
    gl.compileShader(vs);
    var fs = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(fs,
      "precision mediump float;" +
      "varying vec2 v_uv;" +
      "uniform sampler2D u_tex;" +
      "void main(){gl_FragColor=texture2D(u_tex,v_uv);}");
    gl.compileShader(fs);
    var prog = gl.createProgram();
    gl.attachShader(prog, vs);
    gl.attachShader(prog, fs);
    gl.linkProgram(prog);
    gl.useProgram(prog);
    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
    var aPos = gl.getAttribLocation(prog, "a_pos");
    gl.enableVertexAttribArray(aPos);
    gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
    glFilter = params.get("nearest") === "1" ? gl.NEAREST : gl.LINEAR;
    glTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, glTex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, glFilter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, glFilter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.viewport(0, 0, W, H);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  })();

  function glPutTile(x, y, w, h, rgba) {
    gl.texSubImage2D(gl.TEXTURE_2D, 0, x, y, w, h, gl.RGBA, gl.UNSIGNED_BYTE, rgba);
    glNeedsRedraw = true;
  }
  function glFlush() {
    if (glNeedsRedraw) {
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      glNeedsRedraw = false;
    }
  }
  function glResize(w, h) {
    gl.viewport(0, 0, w, h);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
  }

  // Cursor cache: index → {url, hotX, hotY}
  var cursorCache = {};

  // Temp canvas for cursor PNG generation
  var cursorCanvas = document.createElement("canvas");
  var cursorCtx = cursorCanvas.getContext("2d");

  // Audio playback engine
  var audioCtx = null;
  var audioNode = null;
  var audioUseWorklet = false; // true if AudioWorklet path active
  // ScriptProcessor fallback ring buffer (only used when AudioWorklet unavailable)
  var audioRingL = null;
  var audioRingR = null;
  var audioRingSize = 262144;
  var audioRingMask = audioRingSize - 1;
  var audioWritePos = 0;
  var audioReadPos = 0;
  var audioResumed = false;
  var audioPreBuffered = false;
  var audioBufMs = parseInt(params.get("abuf")) || 15;
  var audioPreBufThreshold = 0; // computed in ensureAudioCtx from audioBufMs

  var audioWorkletCode = [
    'class AudioOutputProcessor extends AudioWorkletProcessor {',
    '  constructor() {',
    '    super();',
    '    this.ringL = new Float32Array(262144);',
    '    this.ringR = new Float32Array(262144);',
    '    this.mask = 262143;',
    '    this.wp = 0;',
    '    this.rp = 0;',
    '    this.preBuffered = false;',
    '    this.port.onmessage = (e) => {',
    '      var left = e.data.left;',
    '      var right = e.data.right;',
    '      var frames = left.length;',
    '      var wp = this.wp;',
    '      for (var i = 0; i < frames; i++) {',
    '        var idx = wp & this.mask;',
    '        this.ringL[idx] = left[i];',
    '        this.ringR[idx] = right[i];',
    '        wp++;',
    '      }',
    '      this.wp = wp & this.mask;',
    '      var avail = (this.wp - this.rp) & this.mask;',
    '      if (avail > 253952) {',  // ringSize - 8192
    '        this.rp = (this.wp - 22050) & this.mask;',
    '      }',
    '    };',
    '  }',
    '  process(inputs, outputs) {',
    '    var outL = outputs[0][0];',
    '    var outR = outputs[0][1];',
    '    var len = outL.length;',
    '    var avail = (this.wp - this.rp) & this.mask;',
    '    if (!this.preBuffered) {',
    '      if (avail < 8192) {',
    '        for (var i = 0; i < len; i++) { outL[i] = 0; outR[i] = 0; }',
    '        return true;',
    '      }',
    '      this.preBuffered = true;',
    '    }',
    '    var count = avail < len ? avail : len;',
    '    var rp = this.rp;',
    '    for (var i = 0; i < count; i++) {',
    '      var idx = rp & this.mask;',
    '      outL[i] = this.ringL[idx];',
    '      outR[i] = this.ringR[idx];',
    '      rp++;',
    '    }',
    '    for (var i = count; i < len; i++) { outL[i] = 0; outR[i] = 0; }',
    '    this.rp = rp & this.mask;',
    '    if (count < len) { this.preBuffered = false; }',
    '    return true;',
    '  }',
    '}',
    'registerProcessor("audio-output-processor", AudioOutputProcessor);'
  ].join('\n');

  // Create AudioContext and load worklet for a given sample rate.
  // If an existing context has a different rate, tear it down and recreate.
  function ensureAudioCtx(rate) {
    if (audioCtx) {
      if (audioCtx.sampleRate === rate) return;
      // Rate mismatch — tear down and recreate
      if (audioNode) { audioNode.disconnect(); audioNode = null; }
      audioCtx.close();
      audioCtx = null;
      audioUseWorklet = false;
      audioRingL = null;
      audioRingR = null;
    }
    audioPreBufThreshold = Math.max(128, Math.round(rate * audioBufMs / 1000));
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({sampleRate: rate});

    loadAudioWorklet();

    // Resume immediately (works if called from user gesture context,
    // otherwise the interaction listeners below will resume it).
    audioCtx.resume().then(function() { audioResumed = true; });
  }

  // Load the AudioWorklet processor (or fall back to ScriptProcessor).
  function loadAudioWorklet() {
    if (!audioCtx) return;
    if (audioCtx.audioWorklet) {
      var code = audioWorkletCode.replace('8192', '' + audioPreBufThreshold);
      var blob = new Blob([code], {type: "application/javascript"});
      var url = URL.createObjectURL(blob);
      audioCtx.audioWorklet.addModule(url).then(function() {
        URL.revokeObjectURL(url);
        if (!audioCtx) return;
        audioNode = new AudioWorkletNode(audioCtx, "audio-output-processor", {
          outputChannelCount: [2]
        });
        audioNode.connect(audioCtx.destination);
        audioUseWorklet = true;
      }).catch(function() {
        setupAudioScriptProcessor();
      });
    } else {
      setupAudioScriptProcessor();
    }
  }

  function setupAudioScriptProcessor() {
    if (!audioCtx) return;
    audioRingL = new Float32Array(audioRingSize);
    audioRingR = new Float32Array(audioRingSize);
    audioWritePos = 0;
    audioReadPos = 0;
    audioPreBuffered = false;
    audioUseWorklet = false;

    audioNode = audioCtx.createScriptProcessor(4096, 0, 2);
    audioNode.onaudioprocess = function(e) {
      var outL = e.outputBuffer.getChannelData(0);
      var outR = e.outputBuffer.getChannelData(1);
      var avail = (audioWritePos - audioReadPos) & audioRingMask;
      if (!audioPreBuffered) {
        if (avail < audioPreBufThreshold) {
          for (var i = 0; i < outL.length; i++) { outL[i] = 0; outR[i] = 0; }
          return;
        }
        audioPreBuffered = true;
      }
      var count = Math.min(avail, outL.length);
      var rp = audioReadPos;
      for (var i = 0; i < count; i++) {
        var idx = rp & audioRingMask;
        outL[i] = audioRingL[idx];
        outR[i] = audioRingR[idx];
        rp++;
      }
      for (var i = count; i < outL.length; i++) { outL[i] = 0; outR[i] = 0; }
      audioReadPos = rp & audioRingMask;
      if (count < outL.length) { audioPreBuffered = false; }
    };
    audioNode.connect(audioCtx.destination);
  }

  // Eagerly create AudioContext on first user interaction so it's resumed
  // and the worklet is loaded before audio data arrives from the server.
  function initAudioOnGesture() {
    if (audioCtx) {
      // Context exists — just ensure it's resumed
      if (!audioResumed) {
        audioCtx.resume().then(function() { audioResumed = true; });
      }
      return;
    }
    // Create at browser default rate; ensureAudioCtx will recreate if server rate differs.
    var defaultRate = 44100;
    try {
      var tmp = new (window.AudioContext || window.webkitAudioContext)();
      defaultRate = tmp.sampleRate;
      tmp.close();
    } catch(e) {}
    ensureAudioCtx(defaultRate);
  }
  document.addEventListener("click", initAudioOnGesture, {once: false});
  document.addEventListener("keydown", initAudioOnGesture, {once: false});

  // Microphone capture engine
  // Browser captures at its native rate (e.g. 48000Hz from PipeWire/PulseAudio).
  // Go side resamples to server's format (typically 44100Hz stereo 16-bit).
  // WS message: [0x07][srcRate:u32 LE][srcCh:u16 LE][pcm S16LE interleaved...]
  var micStream = null;
  var micAudioCtx = null;
  var micSource = null;
  var micProcessor = null;
  var micIndicator = document.getElementById("mic-indicator");
  var micBrowserRate = 0;
  // Accumulation buffer for ~10ms chunks
  var micAccumBufs = null; // array of Float32Array per channel
  var micAccumFrames = 0;
  var micAccumTarget = 0; // frames per ~10ms at browser rate

  function startMic(channels, rate, bps, bufMs) {
    stopMic();
    navigator.mediaDevices.getUserMedia({
      audio: {echoCancellation: true, noiseSuppression: true}
    }).then(function(stream) {
      micStream = stream;
      // Use browser's native sample rate — avoids NotSupportedError
      micAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      micBrowserRate = micAudioCtx.sampleRate;
      if (!bufMs || bufMs <= 0) bufMs = 10;
      micAccumTarget = Math.round(micBrowserRate * bufMs / 1000);
      micAccumBufs = null;
      micAccumFrames = 0;
      micSource = micAudioCtx.createMediaStreamSource(stream);

      if (micAudioCtx.audioWorklet) {
        var workletCode = 'class MicProcessor extends AudioWorkletProcessor{process(inputs){if(inputs[0]&&inputs[0].length>0){var out=[];for(var i=0;i<inputs[0].length;i++){out.push(new Float32Array(inputs[0][i]));}this.port.postMessage(out);}return true;}}registerProcessor("mic-processor",MicProcessor);';
        var blob = new Blob([workletCode], {type: "application/javascript"});
        var url = URL.createObjectURL(blob);
        micAudioCtx.audioWorklet.addModule(url).then(function() {
          URL.revokeObjectURL(url);
          if (!micAudioCtx) return;
          var workletNode = new AudioWorkletNode(micAudioCtx, "mic-processor");
          workletNode.port.onmessage = function(e) {
            accumulateAndSend(e.data);
          };
          micSource.connect(workletNode);
          workletNode.connect(micAudioCtx.destination);
          micProcessor = workletNode;
          micIndicator.style.display = "block";
        }).catch(function() {
          setupScriptProcessor();
        });
      } else {
        setupScriptProcessor();
      }
    }).catch(function(err) {
      console.warn("[mic] getUserMedia failed:", err);
    });
  }

  function setupScriptProcessor() {
    if (!micAudioCtx || !micSource) return;
    var proc = micAudioCtx.createScriptProcessor(4096, 2, 2);
    proc.onaudioprocess = function(e) {
      var chans = [];
      for (var ch = 0; ch < e.inputBuffer.numberOfChannels; ch++) {
        chans.push(new Float32Array(e.inputBuffer.getChannelData(ch)));
      }
      accumulateAndSend(chans);
    };
    micSource.connect(proc);
    proc.connect(micAudioCtx.destination);
    micProcessor = proc;
    micIndicator.style.display = "block";
  }

  function accumulateAndSend(inputChannels) {
    var srcCh = inputChannels.length;
    var frames = inputChannels[0].length;
    if (!micAccumBufs) {
      micAccumBufs = [];
      for (var c = 0; c < srcCh; c++) {
        micAccumBufs.push(new Float32Array(micAccumTarget + 256));
      }
      micAccumFrames = 0;
    }
    // Grow if needed
    if (micAccumFrames + frames > micAccumBufs[0].length) {
      for (var c = 0; c < srcCh; c++) {
        var nb = new Float32Array(micAccumFrames + frames + 256);
        nb.set(micAccumBufs[c]);
        micAccumBufs[c] = nb;
      }
    }
    for (var c = 0; c < srcCh; c++) {
      micAccumBufs[c].set(inputChannels[c], micAccumFrames);
    }
    micAccumFrames += frames;
    while (micAccumFrames >= micAccumTarget) {
      var sendChans = [];
      for (var c = 0; c < srcCh; c++) {
        sendChans.push(micAccumBufs[c].subarray(0, micAccumTarget));
      }
      sendMicPCM(sendChans);
      var remain = micAccumFrames - micAccumTarget;
      for (var c = 0; c < srcCh; c++) {
        micAccumBufs[c].copyWithin(0, micAccumTarget, micAccumTarget + remain);
      }
      micAccumFrames = remain;
    }
  }

  function sendMicPCM(inputChannels) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    var srcCh = inputChannels.length;
    var frames = inputChannels[0].length;
    var headerSize = 1 + 4 + 2; // type + rate(u32) + channels(u16)
    var pcmBytes = frames * srcCh * 2;
    var buf = new Uint8Array(headerSize + pcmBytes);
    var dv = new DataView(buf.buffer);
    buf[0] = 0x07;
    dv.setUint32(1, micBrowserRate, true);
    dv.setUint16(5, srcCh, true);
    var off = headerSize;
    for (var i = 0; i < frames; i++) {
      for (var ch = 0; ch < srcCh; ch++) {
        var s = inputChannels[ch][i];
        if (s > 1.0) s = 1.0;
        if (s < -1.0) s = -1.0;
        dv.setInt16(off, (s * 32767) | 0, true);
        off += 2;
      }
    }
    ws.send(buf);
  }

  function stopMic() {
    if (micProcessor) {
      micProcessor.disconnect();
      if (micProcessor.port) micProcessor.port.close();
      micProcessor = null;
    }
    if (micSource) { micSource.disconnect(); micSource = null; }
    if (micStream) {
      micStream.getTracks().forEach(function(t) { t.stop(); });
      micStream = null;
    }
    if (micAudioCtx) { micAudioCtx.close(); micAudioCtx = null; }
    micAccumBufs = null;
    micAccumFrames = 0;
    if (micIndicator) micIndicator.style.display = "none";
  }

  // --- Camera capture (RDPECAM) ---
  var camEncoder = null;
  var camStream = null;
  var camReader = null;
  var camRunning = false;

  function startCamera(width, height, fps) {
    stopCamera();
    if (typeof VideoEncoder === "undefined") {
      console.warn("[cam] VideoEncoder not supported");
      return;
    }
    camRunning = true;
    var camFrameCount = 0;
    var camKeyInterval = fps * 2; // keyframe every 2 seconds
    navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: width }, height: { ideal: height }, frameRate: { ideal: fps } }
    }).then(function(stream) {
      if (!camRunning) { stream.getTracks().forEach(function(t) { t.stop(); }); return; }
      camStream = stream;
      var track = stream.getVideoTracks()[0];
      var settings = track.getSettings();
      var encW = settings.width || width;
      var encH = settings.height || height;

      camEncoder = new VideoEncoder({
        output: function(chunk) {
          var buf = new Uint8Array(1 + chunk.byteLength);
          buf[0] = 0x0C; // wsMsgCameraData
          chunk.copyTo(buf.subarray(1));
          if (ws.readyState === 1) ws.send(buf.buffer);
        },
        error: function(e) { console.error("[cam] encoder error:", e); }
      });
      camEncoder.configure({
        codec: "avc1.420028",
        width: encW,
        height: encH,
        framerate: fps,
        bitrate: encH >= 720 ? 1500000 : 700000,
        latencyMode: "realtime",
        avc: { format: "annexb" }
      });

      // Feed video frames to the encoder.
      // Prefer MediaStreamTrackProcessor (Chrome 94+), fall back to
      // HTMLVideoElement + requestVideoFrameCallback, then setInterval + canvas.
      if (typeof MediaStreamTrackProcessor !== "undefined") {
        var processor = new MediaStreamTrackProcessor({ track: track });
        camReader = processor.readable.getReader();
        (function readFrame() {
          if (!camRunning) return;
          camReader.read().then(function(result) {
            if (result.done || !camRunning) { if (result.value) result.value.close(); return; }
            var frame = result.value;
            if (camEncoder && camEncoder.state === "configured") {
              var isKey = (camFrameCount % camKeyInterval) === 0;
              camEncoder.encode(frame, { keyFrame: isKey });
              camFrameCount++;
            }
            frame.close();
            readFrame();
          }).catch(function(e) { console.error("[cam] readFrame error:", e); });
        })();
      } else {
        // Fallback: render to hidden video + canvas, create VideoFrame manually
        var vid = document.createElement("video");
        vid.srcObject = stream;
        vid.muted = true;
        vid.play();
        var camCanvas = document.createElement("canvas");
        camCanvas.width = encW;
        camCanvas.height = encH;
        var camCtx = camCanvas.getContext("2d");

        function grabFrame() {
          if (!camRunning || !camEncoder || camEncoder.state !== "configured") return;
          camCtx.drawImage(vid, 0, 0, encW, encH);
          var frame = new VideoFrame(camCanvas, { timestamp: camFrameCount * (1000000 / fps) });
          var isKey = (camFrameCount % camKeyInterval) === 0;
          camEncoder.encode(frame, { keyFrame: isKey });
          camFrameCount++;
          frame.close();
        }

        if (vid.requestVideoFrameCallback) {
          (function rvfc() {
            if (!camRunning) return;
            grabFrame();
            vid.requestVideoFrameCallback(rvfc);
          })();
          // Kick off after video starts playing
          vid.requestVideoFrameCallback(function() {});
        } else {
          // Last resort: setInterval
          var camInterval = setInterval(function() {
            if (!camRunning) { clearInterval(camInterval); return; }
            grabFrame();
          }, Math.round(1000 / fps));
        }
      }
    }).catch(function(err) {
      console.warn("[cam] getUserMedia failed:", err);
    });
  }

  function stopCamera() {
    camRunning = false;
    if (camReader) { camReader.cancel().catch(function(){}); camReader = null; }
    if (camEncoder && camEncoder.state !== "closed") { camEncoder.close(); camEncoder = null; }
    if (camStream) { camStream.getTracks().forEach(function(t) { t.stop(); }); camStream = null; }
  }

  // Set tab title from monitor params
  var monIdx = params.get("monitor");
  if (monIdx !== null) {
    var monTitle = "Display " + monIdx;
    if (params.get("primary") === "1") monTitle += " (primary)";
    document.title = monTitle;
  }

  // H.264/WebCodecs support: detect capability and append to WS URL
  var hasWebCodecs = typeof VideoDecoder !== "undefined";
  var avcParam = hasWebCodecs ? "&avc=1" : "";

  // Forward DPI scale params from page URL to WebSocket URL so the server
  // can apply MS-RDPBCGR Client Core Data desktopScaleFactor/deviceScaleFactor
  // before negotiating the RDP session.
  var scaleParam = "";
  var s = params.get("scale");
  if (s) scaleParam += "&scale=" + encodeURIComponent(s);
  var ds = params.get("devscale");
  if (ds) scaleParam += "&devscale=" + encodeURIComponent(ds);

  // Connect WebSocket, passing resolution for RDP auto-sizing
  var proto = location.protocol === "https:" ? "wss:" : "ws:";
  var ws = new WebSocket(proto + "//" + location.host + "/ws?w=" + W + "&h=" + H + "&monitor=" + (monIdx || "0") + avcParam + scaleParam);
  ws.binaryType = "arraybuffer";

  // H.264 decoder state
  // AVC420 (mode=0) and AVC444-luma (mode=1) use separate decoders
  // to avoid corrupting H.264 reference frame state between streams.
  // AVC444-chroma (mode=2) is skipped — luma alone gives 4:2:0 quality.

    var text = (e.clipboardData || window.clipboardData).getData("text/plain");
    if (text && ws.readyState === WebSocket.OPEN) {
      var encoded = new TextEncoder().encode(text);
      var msg = new Uint8Array(1 + encoded.length);
      msg[0] = 0x05;
      msg.set(encoded, 1);
      ws.send(msg);
    }
    // Send paste keystroke to remote.
    // Linux: Ctrl is already held from keydown handler, just send V↓.
    // macOS: Cmd was suppressed, send full Ctrl+V sequence.
    if (isMac) {
      sendKey("ControlLeft", true);
      sendKey("KeyV", true);
      sendKey("KeyV", false);
      sendKey("ControlLeft", false);
    } else {
      sendKey("KeyV", true);
    }
  });
  document.addEventListener("keyup", function(e) {
    if (e.code === "F11") return;
    // macOS: suppress Meta (Cmd) release — we never sent it as Win key.
    if (isMac && (e.code === "MetaLeft" || e.code === "MetaRight")) return;
    e.preventDefault();
    if (kbMode === "unicode" && !controlKeyCodes.has(e.code) && !e.ctrlKey && !e.altKey && !e.metaKey) {
      // In unicode mode, key release for printable chars already sent above
      return;
    }
    sendKey(e.code, false);
  });

  // Mouse input: [0x02][x:u16 LE][y:u16 LE][buttons:u16 LE]
  var mouseButtons = 0;

  function sendMouse(x, y) {
    var buf = new Uint8Array(7);
    buf[0] = 0x02;
    buf[1] = x & 0xFF; buf[2] = (x >> 8) & 0xFF;
    buf[3] = y & 0xFF; buf[4] = (y >> 8) & 0xFF;
    var flags = 0x0800 | mouseButtons; // PTRFLAGS_MOVE
    buf[5] = flags & 0xFF; buf[6] = (flags >> 8) & 0xFF;
    ws.send(buf);
  }

  canvas.addEventListener("mousemove", function(e) {
    var rect = canvas.getBoundingClientRect();
    var x = Math.round((e.clientX - rect.left) * (W / rect.width));
    var y = Math.round((e.clientY - rect.top) * (H / rect.height));
    sendMouse(x, y);
  });

  canvas.addEventListener("mousedown", function(e) {
    e.preventDefault();
    var rect = canvas.getBoundingClientRect();
    var x = Math.round((e.clientX - rect.left) * (W / rect.width));
    var y = Math.round((e.clientY - rect.top) * (H / rect.height));
    var btn = 0;
    if (e.button === 0) btn = 0x1000; // PTRFLAGS_BUTTON1
    else if (e.button === 2) btn = 0x2000; // PTRFLAGS_BUTTON2
    else if (e.button === 1) btn = 0x4000; // PTRFLAGS_BUTTON3
    mouseButtons = btn;
    var flags = 0x8000 | btn; // PTRFLAGS_DOWN | button
    var buf = new Uint8Array(7);
    buf[0] = 0x02;
    buf[1] = x & 0xFF; buf[2] = (x >> 8) & 0xFF;
    buf[3] = y & 0xFF; buf[4] = (y >> 8) & 0xFF;
    buf[5] = flags & 0xFF; buf[6] = (flags >> 8) & 0xFF;
    ws.send(buf);
  });

  canvas.addEventListener("mouseup", function(e) {
    e.preventDefault();
    var rect = canvas.getBoundingClientRect();
    var x = Math.round((e.clientX - rect.left) * (W / rect.width));
    var y = Math.round((e.clientY - rect.top) * (H / rect.height));
    var btn = 0;
    if (e.button === 0) btn = 0x1000;
    else if (e.button === 2) btn = 0x2000;
    else if (e.button === 1) btn = 0x4000;
    mouseButtons = 0;
    // Release: button flag without PTRFLAGS_DOWN
    var flags = btn;
    var buf = new Uint8Array(7);
    buf[0] = 0x02;
    buf[1] = x & 0xFF; buf[2] = (x >> 8) & 0xFF;
    buf[3] = y & 0xFF; buf[4] = (y >> 8) & 0xFF;
    buf[5] = flags & 0xFF; buf[6] = (flags >> 8) & 0xFF;
    ws.send(buf);
  });

  canvas.addEventListener("wheel", function(e) {
    e.preventDefault();
    var rect = canvas.getBoundingClientRect();
    var x = Math.round((e.clientX - rect.left) * (W / rect.width));
    var y = Math.round((e.clientY - rect.top) * (H / rect.height));
    var delta = Math.round(-e.deltaY / 100) || (e.deltaY < 0 ? 1 : -1);
    var horiz = 0;
    if (e.deltaX !== 0 && e.deltaY === 0) {
      delta = Math.round(-e.deltaX / 100) || (e.deltaX < 0 ? 1 : -1);
      horiz = 1;
    }
    var buf = new Uint8Array(8);
    buf[0] = 0x03;
    buf[1] = x & 0xFF; buf[2] = (x >> 8) & 0xFF;
    buf[3] = y & 0xFF; buf[4] = (y >> 8) & 0xFF;
    // delta as signed i16 LE
    var d16 = delta & 0xFFFF;
    buf[5] = d16 & 0xFF; buf[6] = (d16 >> 8) & 0xFF;
    buf[7] = horiz;
    ws.send(buf);
  }, {passive: false});

  canvas.addEventListener("contextmenu", function(e) { e.preventDefault(); });

  // Dynamic resize: detect window resize with 200ms debounce. The dpr
  // variable is refreshed from window.devicePixelRatio at the top of the
  // callback so cross-monitor drags pick up the new scale factor before
  // computing the new RDP framebuffer size.
  var resizeTimer = null;
  window.addEventListener("resize", function() {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() {
      dpr = noDPR ? 1 : (window.devicePixelRatio || 1);
      var newW = Math.round(window.innerWidth * dpr);
      var newH = Math.round(window.innerHeight * dpr);
      if (newW === W && newH === H) return;
      if (ws.readyState !== WebSocket.OPEN) return;
      // Send resize message: [0x04][w:u16 LE][h:u16 LE]
      var buf = new Uint8Array(5);
      buf[0] = 0x04;
      buf[1] = newW & 0xFF; buf[2] = (newW >> 8) & 0xFF;
      buf[3] = newH & 0xFF; buf[4] = (newH >> 8) & 0xFF;
      ws.send(buf);
      // Update local dimensions and resize canvas
      W = newW;
      H = newH;
      canvas.width = W;
      canvas.height = H;
      canvas.style.width = (W / dpr) + "px";
      canvas.style.height = (H / dpr) + "px";
    }, 200);
  });
})();
</script>
</body>
</html>
